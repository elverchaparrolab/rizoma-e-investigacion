name: Publicar en GitHub Pages

# Construye el sitio con Quartz y lo publica en la rama gh-pages.
# GitHub Pages sirve esa rama en https://elverchaparrolab.github.io/rizoma-e-investigacion/

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Instalar dependencias
        run: npm ci
      - name: Construir el sitio
        run: npx quartz build
      - name: Evitar el procesamiento de Jekyll
        run: touch public/.nojekyll
      - name: Publicar en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publicar sitio"
