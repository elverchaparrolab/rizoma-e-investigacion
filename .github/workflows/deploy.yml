name: Publicar en GitHub Pages

# Construye el sitio con Quartz y lo publica en la rama gh-pages.
# GitHub Pages sirve esa rama en https://elverchaparrolab.github.io/rizoma-e-investigacion/

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Instalar dependencias
        run: npm ci
      - name: Construir el sitio
        run: node quartz/bootstrap-cli.mjs build
      - name: Publicar el laboratorio como entrada y conservar las lecturas
        if: ${{ hashFiles('sitio/laboratorio.html') != '' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          source = Path('sitio')
          target = Path('public')
          assets = '''index.html styles.css guide.js laboratorio.html laboratorio.css core.js laboratorio.js ai-core.js ai-worker.js tarjeta.png elver-chaparro-cardozo.jpg'''.split()
          missing = [name for name in assets if not (source / name).is_file()]
          if missing:
              raise SystemExit('Faltan archivos del laboratorio: ' + ', '.join(missing))
          for name in assets:
              shutil.copy2(source / name, target / name)
          print(f'Laboratorio publicado con {len(assets)} archivos; lecturas de Quartz conservadas.')
          PY
      - name: Evitar el procesamiento de Jekyll
        run: touch public/.nojekyll
      - name: Publicar en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Publicar sitio"
